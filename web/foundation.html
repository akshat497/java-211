    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* id selector 
        class selector
        tag selector
        child selector
        attribute selector
        decendant selector
        group selectors  */

        table{
            background-color: black;
            color: aliceblue;
            font-size: larger;
            font-weight: bolder;
            border: 2px solid red;

        }
        th,td{
            padding: 10px;
        }
        
    #box{
        height: 100px;
        width: 100px;
        background-color: antiquewhite;
        margin-left: 10px;
        border: 2px solid black;

    }
    #parent{
        border: 2px solid black;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
     #loader{
        height: 40px;
        width: 40px;
        border: 8px solid black;
        border-top-color: white;
        border-right-color: white;
        
        border-radius:50% ;
        animation: loading 1s infinite ease-in-out;
     }
     @keyframes loading {
        from    {
            transform: rotate(0deg);

        }
         to    {
            transform: rotate(360deg);
        }
        
     }
     #ytLoader{
        border-top: 3px solid red;
        animation: ytloading 2s infinite ease-in-out;
        
     }
     @keyframes ytloading {
         from    {
            width: 10px;

        }
         to    {
            width: 100vw;
        }
        
     }
     *{
        margin: 0;
     }
    </style>
</head>
