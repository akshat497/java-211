      .loading {
        height: 20px;
        width: 20px;
        border: 5px solid gray;
        border-top-color: black;
        border-radius: 50%;
        animation: loader 2s infinite linear;
      }
      @keyframes loader {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .lineborder {
        width: 100vw;
        border-top: 3px solid red;
        animation: loading 3s ease-in-out infinite;
        border-radius: 20px;
      }

      @keyframes loading {
        0% {
          width: 10vw;
        }
        50% {
          width: 50vw;
        }
        100% {
          width: 100vw;
        }
      }
      * {
        margin: 0;
      }
      .skeleton {
        height: 280px;
        width: 350px;
        /* border: 2px solid black; */
        margin: 10%;
        padding: 10px;
        animation: fade 3s infinite ease-in-out alternate;
        transition: all 0.5s;
      }
      #video {
        height: 50%;
        width: 350px;
       
        background-color: gray;
      }
      #profile {
        height: 30px;
        width: 30px;
        border-radius: 50%;
       
         background-color: gray;
      }
      #title {
        height: 20px;
        width: 80%;

        background-color: gray;
        margin: 2%;
      }
      #description {
        height: 20px;
        width: 50%;
margin: 2%;
        background-color: gray;
      }
      .xyz{
        display: flex;
        flex-direction: column;
        width: 80%;
      }
      .detailes{
        margin: 2%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      @keyframes fade {
        from{
            opacity: 0.3;
        }
        to{
            opacity: 1;
        }

        
      }
      .container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
      }
    </style>
