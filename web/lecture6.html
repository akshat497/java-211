      .loading {
        height: 20px;
        width: 20px;
        border: 3px solid white;
        border-top-color: black;
        border-right-color: black;
        border-radius: 50%;
        animation: loader 1s infinite linear;
      }
      @keyframes loader {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .lineborder {
        width: 100vw;
        border-top: 3px solid red;
        animation: loading 3s ease-in-out infinite;
        border-radius: 20px;
        position: fixed;
        top: 0;
      }

      @keyframes loading {
        0% {
          width: 10vw;
        }
        50% {
          width: 50vw;
        }
        100% {
          width: 100vw;
        }
      }
      * {
        margin: 0;
      }
      .skeleton {
        height: 280px;
        width: 350px;
        /* border: 2px solid black; */
        margin: 10%;
        padding: 10px;
        /* animation: fade 3s infinite ease-in-out alternate; */
        transition: all 0.5s;
      }
      #video {
        position: relative;
        height: 50%;
        width: 350px;

        background-color: gray;
      }
      #profile {
        height: 30px;
        width: 30px;
        border-radius: 50%;

        background-color: gray;
      }
      #title {
        height: 20px;
        width: 80%;

        background-color: gray;
        margin: 2%;
      }
      #description {
        height: 20px;
        width: 50%;
        margin: 2%;
        background-color: gray;
      }
      .xyz {
        display: flex;
        flex-direction: column;
        width: 80%;
      }
      .detailes {
        margin: 2%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      @keyframes fade {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 1;
        }
      }
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 86%;
        position: relative;
        left: 10%;
        overflow: scroll;
        scrollbar-width: none;
      }
      header {
        padding: 10px;
        width: auto;
        height: 40px;
        background-color: black;
        display: flex;
        color: aliceblue;
        justify-content: space-evenly;
        font-size: larger;
        align-items: center;
        border-bottom: 1px solid gray;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header input {
        border-radius: 20px;
        width: 60%;
        height: 30px;
        padding: 5px;
      }
      #search {
        height: 60%;
        width: 50%;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .CNPContainer {
        display: flex;
        gap: 15px;
      }
      #Create {
        border: 1px solid gray;
        border-radius: 20px;
        padding: 5px;
      }
      #microphone {
        color: aliceblue;
        padding: 2px;
        border: 1px solid gray;
        background-color: gray;
        border-radius: 50%;
      }
      #notification {
        font-size: larger;
      }
      #Profile {
        height: 40px;
        width: 40px;
        border-radius: 50%;
        background-color: gray;
      }
      #shimmer {
        position: absolute;
        height: 100%;
        width: 50px;
        background-color: whitesmoke;
        opacity: 0.2;
        box-shadow: 10px 25px 25px 25px whitesmoke;
        animation: shimming 2s infinite ease-in-out;
      }
      body {
        background-color: black;
      }
      @keyframes shimming {
        from {
          transform: translatex(0px);
        }
        to {
          transform: translateX(250px);
        }
      }

      #sidebar {
        width: 10%;
        height: 100vh;
        background-color: gray;
        position: fixed;
        z-index: -1;
        top: 55px;
        background-color: black;
        border-right: 1px solid gray;
        display: flex;
        padding: 10px;
        flex-direction: column;
        gap: 40px;
        align-items: center;
        margin: 1%;
      }
      #Logo {
        display: flex;
        align-items: center;
        gap: 30px;
      }
