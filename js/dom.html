<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    <style>
      .box {
        height: 100px;
        width: 100px;
        border: 2px solid black;
      }
      div {
        display: flex;
        flex-direction: column;
        padding: 1%;
        gap: 10px;
        background-color: rgb(201, 196, 196);
        border-radius: 20px;
      }
      table {
        width: 95vw;
        margin: 1%;
        border-color: red;
      }
      .dltBtn {
        background-color: red;
        color: aliceblue;
        padding: 5px;
      }
      .uptBtn {
        background-color: skyblue;
        color: aliceblue;
        padding: 5px;
      }
      .buttons {
        display: flex;
        justify-content: space-between;
      }
      .alert {
        opacity: 0;
        display: none;
        transition: all 1s ease-in-out;
      }
      /* Update Button */
      .update-btn {
        padding: 10px 20px;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      } /* Modal Background */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      } /* Modal Box */
      .modal-content {
        background-color: white;
        width: 400px;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }
      .modal-content h2 {
        margin-top: 0;
      }
      .modal-content input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 15px;
        box-sizing: border-box;
      }
      .save-btn {
        padding: 10px 20px;
        background-color: green;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .close-btn {
        padding: 10px 20px;
        background-color: gray;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      Name:-<input type="text" placeholder="enter a name" id="name" /> Email:-
      <input type="text" placeholder="enter a email" id="email" /> Phone:-
      <input type="text" placeholder="enter a phone number" id="phone" />
      Age:-<input type="number" placeholder="enter age" id="age" />
      <button onclick="addData()">Submit</button>
    </div>
    <div class="alert alert-danger" role="alert"></div>
    <div class="modal" id="updateModal">
      <div class="modal-content">
        <h2>Update Student</h2>
        <label>Name</label> <input type="text" id="ModalName" />
        <label>Email</label> <input type="text" id="ModalEmail" />
        <label>Phone</label> <input type="text" id="ModalPhone" />
        <label>Age</label> <input type="text" id="ModalAge" />
        <button class="save-btn" onclick="saveChanges()" id="ModalSaveButton">
          Save Changes
        </button>
        <button class="close-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
    <div class="modal" id="deleteModal">
      <div class="modal-content">
        <h2>Delete Student</h2>
        <div id="divContent"></div>

        <button
          class="btn btn-danger"
          onclick="deleteRow()"
          id="ModalDeleteButton"
        >
          Delete
        </button>
        <button class="close-btn" onclick="closeDeleteModal()">Cancel</button>
      </div>
    </div>
    <input
      type="search"
      id="searchBar"
      placeholder="Search by email"
      onkeydown="SearchEmail()"
    />
    <table border>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Age <p onclick="sortAge()" ondblclick="originalstate()">⇅</p></th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

        let student = students.filter(function (value, index) {
          return index == passedIndex;

        modalBody.style.display = "flex";

      function showAlert(message) {
        var alertBox = document.getElementsByClassName("alert");
        console.log(alertBox);
        alertBox[0].style.display = "block";
        alertBox[0].style.opacity = 1;
        alertBox[0].innerText = message;
        setTimeout(() => {
          alertBox[0].style.display = "none";
          alertBox[0].style.opacity = 0;
        }, 3000);
      }
      function addData() {
        if (
          Username.value.trim() == "" ||
          Useremail.value.trim() == "" ||
          Userphone.value.trim() == "" ||
          Userage.value.trim() == ""
        ) {
          showAlert("Empty values are not allowed");
          return;
        }
        let duplicatevalue = students.some(function (value, index) {
          return value.email == Useremail.value;
        });
        if (duplicatevalue) {
          showAlert("duplicate values are not allowed");
          return;
        }
        let phoneLength = Userphone.value.length;
        console.log(phoneLength);
        if (phoneLength > 10) {
          showAlert("Phone number length should be 10 digits!");
          return;
        }
        let correctEmail =
          Useremail.value.includes("@") && Useremail.value.includes(".");

        students.push(student);

        display();

      display();
      function updateRow(passedIndex) {
        let row = students.filter(function (value, index) {
          return index == passedIndex;
        });
        let name = document.getElementById("ModalName");
        let email = document.getElementById("ModalEmail");
        let Phone = document.getElementById("ModalPhone");
        let age = document.getElementById("ModalAge");
        let button = document.getElementById("ModalSaveButton");
        button.setAttribute("name", passedIndex);
        name.value = row[0].name;
        email.value = row[0].email;
        Phone.value = row[0].phone;
        age.value = row[0].age;
        console.log(row);
        openModal();
      }
      function saveChanges() {
        let name = document.getElementById("ModalName");
        let email = document.getElementById("ModalEmail");
        let Phone = document.getElementById("ModalPhone");
        let age = document.getElementById("ModalAge");
        let id = document.getElementById("ModalSaveButton");
        console.log(students);
        students.map(function (value, index) {
          if (index == id.name) {
            value.name = name.value;
            value.email = email.value;
            value.phone = Phone.value;
            value.age = age.value;
          }
        });
        localStorage.setItem("students", JSON.stringify(students));
        display();
        closeModal();
      }
      function deleteRow() {
        let id=document.getElementById("ModalDeleteButton");
        console.log(id.name)
       
        let newArray = students.filter(function (value, ourIndex) {
          return id.name != ourIndex;
        });
        students = newArray;
        localStorage.setItem("students", JSON.stringify(students));
        closeDeleteModal()
        display();
      }

      function SearchEmail() {
        let searchedtag = document.getElementById("searchBar");
