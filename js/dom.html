    <style>
      .box {
        height: 100px;
        width: 100px;
        border: 2px solid black;
      }
      div {
        display: flex;
        flex-direction: column;
        padding: 1%;
        gap: 10px;
        background-color: rgb(201, 196, 196);
        border-radius: 20px;
      }
      table {
        width: 95vw;
        margin: 1%;
        border-color: red;
      }
      .dltBtn {
        background-color: red;
        color: aliceblue;
        padding: 5px;
      }
      .uptBtn {
        background-color: skyblue;
        color: aliceblue;
        padding: 5px;
      }
      .buttons {
        display: flex;
        justify-content: space-between;
      }
      .alert {
        opacity: 0;
        display: none;
        transition: all 1s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div>
      Name:-<input type="text" placeholder="enter a name" id="name" /> Email:-
      <input type="text" placeholder="enter a email" id="email" /> Phone:-
      <input type="text" placeholder="enter a phone number" id="phone" />
      Age:-<input type="number" placeholder="enter age" id="age" />
      <button onclick="addData()">Submit</button>
    </div>
    <div class="alert alert-danger" role="alert"></div>
    <table border>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Age</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

      var tbody = document.getElementById("tbody");
      var Username = document.getElementById("name");
      var Useremail = document.getElementById("email");
      var Userphone = document.getElementById("phone");
      var Userage = document.getElementById("age");

      var students = [];

      function showAlert(message) {
        var alertBox = document.getElementsByClassName("alert");
        console.log(alertBox);
        alertBox[0].style.display = "block";
        alertBox[0].style.opacity = 1;
        alertBox[0].innerText = message;
        setTimeout(() => {
          alertBox[0].style.display = "none";
          alertBox[0].style.opacity = 0;
        }, 3000);
      }
      function addData() {
        if (
          Username.value.trim() == "" ||
          Useremail.value.trim() == "" ||
          Userphone.value.trim() == "" ||
          Userage.value.trim() == ""
        ) {
          showAlert("Empty values are not allowed");
          return;
        }
        let duplicatevalue = students.some(function (value, index) {
          return value.email == Useremail.value;
        });
        if (duplicatevalue) {
          showAlert("duplicate values are not allowed");
          return;
        }
        let phoneLength = Userphone.value.length;
        console.log(phoneLength);
        if (phoneLength > 10) {
          showAlert("Phone number length should be 10 digits!");
          return;
        }
      let correctEmail= Useremail.value.includes("@")&&Useremail.value.includes(".");
      if(!correctEmail){
        showAlert("Email format is not correct");
          return;
      }

        // var tableRow=document.createElement("tr")
        // var name=document.createElement('td')
        // var email=document.createElement('td')
        // var phone=document.createElement('td')
        // var age=document.createElement('td')

        // name.innerText=Username.value;
        // phone.innerText=Userphone.value;
        // email.innerText=Useremail.value;
        // age.innerText=Userage.value;
        tbody.innerHTML = "";
        student = {
          name: Username.value,
          email: Useremail.value,
          phone: Userphone.value,
          age: Userage.value,
        };
        students.push(student);
        display();

        // console.log(students)
        // tableRow.append(name,email,phone,age,dltBtn)
        // tbody.append(tableRow)
      }
      function display() {
        console.log(students);
        tbody.innerHTML = "";
        students.forEach(function (value, index) {
          // tableRow.append(name,email,phone,age,dltBtn)
          tbody.innerHTML += `<tr>
                <td>${value.name}</td>
                <td>${value.email}</td>
                <td>${value.phone}</td>
                <td>${value.age}</td>
                <td class="buttons"><button class="dltBtn" onclick="deleteRow(${index})">Delete</button>   <button class="uptBtn" onclick="deleteRow(${index})">Update</button></td>
             
                
                
                </tr>`;
        });
      }
      function deleteRow(index) {
        console.log(index);
        let newArray = students.filter(function (value, ourIndex) {
          return index != ourIndex;
        });
        students = newArray;
        display();
      }
