  <body>

       Name:-<input type="text" placeholder="enter a name" id="name"/>
       Email:- <input type="text" placeholder="enter a email" id="email"/>
       Phone:- <input type="text" placeholder="enter a phone number"id="phone"/>
       Age:-<input type="text" placeholder="enter age" id="age"/>
      <button onclick="addData()">Submit</button>
    </div>
    <table border>

                 <th>Email</th>

    var tbody=document.getElementById("tbody");
    var Username=document.getElementById('name')
    var Useremail=document.getElementById('email')
    var Userphone=document.getElementById('phone')
    var Userage=document.getElementById('age')

    function addData(){
        var tableRow=document.createElement("tr")
        var name=document.createElement('td')
        var email=document.createElement('td')
        var phone=document.createElement('td')
        var age=document.createElement('td')
        name.innerText=Username.value;
        phone.innerText=Userphone.value;
        email.innerText=Useremail.value;
        age.innerText=Userage.value;

        tbody.append(tableRow)
