      var tbody = document.getElementById("tbody");

      function display() {
        console.log(students);
        tbody.innerHTML = "";

          tbody.innerHTML += `<tr>
                <td>${value.name}</td>
                <td>${value.email}</td>
                <td>${value.phone}</td>
                <td>${value.age}</td>
                <td class="buttons"><button class="dltBtn" onclick="deleteRow(${index})">Delete</button>   <button class="uptBtn" onclick="deleteRow(${index})">Update</button></td>
             
                
                
                </tr>`;
        });
      }
      function deleteRow(index) {
        console.log(index);
        let newArray = students.filter(function (value, ourIndex) {
          return index != ourIndex;
        });
        students = newArray;
        display();
