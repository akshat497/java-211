<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  <link href="./dom.css" rel="stylesheet"/>
  </head>
  <body>
    <div>
      Name:-<input type="text" placeholder="enter a name" id="name" /> Email:-
      <input type="text" placeholder="enter a email" id="email" /> Phone:-
      <input type="text" placeholder="enter a phone number" id="phone" />
      Age:-<input type="number" placeholder="enter age" id="age" />
      <button onclick="addData()">Submit</button>
    </div>
    <div class="alert alert-danger" role="alert"></div>
    <div class="modal" id="updateModal">
      <div class="modal-content">
        <h2>Update Student</h2>
        <label>Name</label> <input type="text" id="ModalName" />
        <label>Email</label> <input type="text" id="ModalEmail" />
        <label>Phone</label> <input type="text" id="ModalPhone" />
        <label>Age</label> <input type="text" id="ModalAge" />
        <button class="save-btn" onclick="saveChanges()" id="ModalSaveButton">
          Save Changes
        </button>
        <button class="close-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
    <div class="modal" id="deleteModal">
      <div class="modal-content">
        <h2>Delete Student</h2>
        <div id="divContent"></div>

        <button
          class="btn btn-danger"
          onclick="deleteRow()"
          id="ModalDeleteButton"
        >
          Delete
        </button>
        <button class="close-btn" onclick="closeDeleteModal()">Cancel</button>
      </div>
    </div>
    <input
      type="search"
      id="searchBar"
      placeholder="Search by email"
      onkeydown="SearchEmail()"
    />
    <table class="table table-striped">
      <thead>
        <tr id="headers">
          <th>Title<lable id="nameSort" onclick="sortColumn('name')" ondblclick="originalstate()" >⇅</lable></th>
          <th>Author<lable id="emailSort" onclick="sortColumn('email')" ondblclick="originalstate()">⇅</lable></th>
          <th>quantity<lable id="PhoneSort" onclick="sortColumn('phone')" ondblclick="originalstate()">⇅</lable></th>
          <th>Age <lable id="ageSort" onclick="sortColumn('age')" ondblclick="originalstate()">⇅</lable></th>
          <th id="action">Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <script src="./dom.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
